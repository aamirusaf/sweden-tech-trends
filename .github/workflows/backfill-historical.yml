name: Backfill historical data

# Run by hand from the Actions tab. Downloads Arbetsförmedlingen's Historical Ads
# files (one per year, ~0.1-1.5 GB each), counts monthly tech mentions in each
# file in parallel, then merges the results into backend/data/historical_monthly.csv
# and commits it to main. If one file fails, use "Re-run failed jobs" and the merge
# step runs once they all succeed.

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Historical Ads files to process (JSON list of names)"
        required: true
        default: '["2006","2007","2008","2009","2010","2011","2012","2013","2014","2015","2016","2017","2018","2019","2020","2021","2022","2023","2024","2025","2026-Q1","2026-Q2","2026-Q3"]'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        file: ${{ fromJSON(inputs.files) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Count tech mentions in ${{ matrix.file }}
        run: python backend/backfill_historical.py count "${{ matrix.file }}" --out "partial/${{ matrix.file }}.csv"

      - uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.file }}
          path: partial/${{ matrix.file }}.csv
          retention-days: 7

  merge:
    needs: count
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: partial-*
          path: partial
          merge-multiple: true

      - name: Merge into historical_monthly.csv
        run: python backend/backfill_historical.py merge partial/*.csv --out backend/data/historical_monthly.csv

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add backend/data/historical_monthly.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Backfill historical monthly tech demand"
          git pull --rebase origin main
          git push
