name: Probe (temporary)
on:
  push:
    branches: [claude/project-thread-c1oxez]
    paths: [.github/workflows/probe-tmp.yml]
jobs:
  taxonomy:
    runs-on: ubuntu-latest
    steps:
      - name: Data/IT legacy occupation ids from the taxonomy
        shell: python
        run: |
          import json, urllib.request, urllib.parse
          q = '''query { concepts(id: "apaJ_2ja_LuF") { narrower(type: "ssyk-level-4") { preferred_label narrower(type: "occupation-name", include_deprecated: true) { preferred_label deprecated_legacy_id } } } }'''
          url = "https://taxonomy.api.jobtechdev.se/v1/taxonomy/graphql?" + urllib.parse.urlencode({"query": q})
          d = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"accept": "application/json"}), timeout=60))
          out = {}
          for c in d["data"]["concepts"]:
              for g in c["narrower"]:
                  for o in g["narrower"]:
                      if o.get("deprecated_legacy_id"):
                          out[str(o["deprecated_legacy_id"])] = o["preferred_label"]
          print("IDS_JSON", json.dumps(dict(sorted(out.items(), key=lambda kv: int(kv[0]))), ensure_ascii=False))
  coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        year: ["2007", "2008", "2009", "2010", "2011"]
    steps:
      - name: Share of ads with an occupation id in ${{ matrix.year }}
        shell: python
        run: |
          import json, urllib.request, zipfile, collections
          fn = "${{ matrix.year }}.jsonl.zip"
          urllib.request.urlretrieve("https://data.jobtechdev.se/annonser/historiska/" + fn, fn)
          z = zipfile.ZipFile(fn); n = 0; ids = collections.Counter(); months = collections.Counter()
          for m in z.namelist():
              if m.endswith("/"): continue
              with z.open(m) as f:
                  for line in f:
                      line = line.strip().lstrip(b"[").rstrip(b",").rstrip(b"]").rstrip(b",")
                      if not line: continue
                      try: ad = json.loads(line)
                      except Exception: continue
                      n += 1
                      occ = ad.get("occupation") or {}
                      occ = occ[0] if isinstance(occ, list) and occ else occ
                      lid = str((occ or {}).get("legacy_ams_taxonomy_id"))
                      ids["zero" if lid in ("0", "None", "") else "set"] += 1
                      if lid not in ("0", "None", ""):
                          months[(ad.get("publication_date") or "")[:7]] += 1
          print("${{ matrix.year }}", n, dict(ids), "first months with ids:", sorted(months.items())[:4])
