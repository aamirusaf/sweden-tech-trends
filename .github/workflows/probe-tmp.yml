name: Probe (temporary)
on:
  push:
    branches: [claude/project-thread-c1oxez]
    paths: [.github/workflows/probe-tmp.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        shell: python
        run: |
          import json, urllib.request, urllib.parse, time
          def total(q, **extra):
              p = {"q": q, "limit": 0, **extra}
              u = "https://jobsearch.api.jobtechdev.se/search?" + urllib.parse.urlencode(p)
              try:
                  return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"accept": "application/json"}), timeout=30))["total"]["value"]
              except Exception as e:
                  return f"ERR {e}"
          for q in ["C", "\"C\"", "C++", "\"C++\"", "C#", ".NET", "NET", "Microsoft 365", "\"Microsoft 365\"", "Active Directory", "\"Active Directory\"", "Entra", "\"Entra ID\"", "Git", "React", "Linux", "GCP", "\"Google Cloud\"", "Python", "Azure", "SQL", "Go", "golang", "Java", "JavaScript"]:
              print(f"{q!r:24} all={total(q)!s:>6}  it={total(q, **{'occupation-field': 'apaJ_2ja_LuF'})!s:>6}", flush=True)
              time.sleep(0.3)
          for url in ["https://jobstream.api.jobtechdev.se/snapshot"]:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"accept": "application/json"}), timeout=180)
                  n = 0
                  while chunk := r.read(1 << 20):
                      n += len(chunk)
                  print(url, r.status, f"{n/1e6:.0f} MB")
              except Exception as e:
                  print(url, "ERR", e)
