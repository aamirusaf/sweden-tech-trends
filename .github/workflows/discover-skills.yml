name: Discover top skills

# Run by hand from the Actions tab (e.g. once a year) to check whether the 20 skills
# in backend/main.py are still the most-mentioned ones in Data/IT job ads. Read the
# ranking in each job's log; nothing is committed.
on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source: [live, "2025", "2026-Q3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Scan
        run: |
          mkdir -p discovery
          if [ "${{ matrix.source }}" = live ]; then
            python backend/discover_skills.py live --out discovery/live.json
          else
            python backend/discover_skills.py hist "${{ matrix.source }}" --out "discovery/hist-${{ matrix.source }}.json"
          fi
          python backend/discover_skills.py report discovery/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ matrix.source }}
          path: discovery/
